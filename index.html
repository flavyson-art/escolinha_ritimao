<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Ritimão - Oficial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #aaa; --destaque: #ffd700; --erro: #ff4444; --sucesso: #00ff00; }
        body, html { margin: 0; padding: 0; width: 100%; background-color: var(--preto); color: var(--branco); font-family: 'Segoe UI', Arial, sans-serif; }
        
        /* Container Principal */
        .container { max-width: 500px; margin: 40px auto; background: rgba(10, 10, 10, 0.95); padding: 30px; border-radius: 20px; border: 1px solid #333; }
        
        /* Estilização de Campos */
        .campo { display: flex; flex-direction: column; margin-bottom: 20px; position: relative; }
        label { margin-bottom: 8px; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; color: var(--cinza); }
        input, select { padding: 15px; border: 1px solid #444; background: #000; color: #fff; border-radius: 10px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--destaque); }
        
        /* Feedback de Validação */
        .valido { border-color: var(--sucesso) !important; }
        .invalido { border-color: var(--erro) !important; }
        .msg-erro { color: var(--erro); font-size: 0.65rem; margin-top: 5px; display: none; }

        /* Botão Enviar */
        #btnFinalizar { width: 100%; padding: 20px; background: var(--branco); color: var(--preto); border: none; font-weight: 900; cursor: pointer; border-radius: 10px; font-size: 1.1rem; text-transform: uppercase; transition: 0.3s; }
        #btnFinalizar:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Modal PIX */
        #modalPix { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .pix-content { background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--destaque); text-align: center; max-width: 400px; width: 100%; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="area-formulario">
        <h2 style="text-align: center; margin-bottom: 30px;">INSCRIÇÃO 2026</h2>
        
        <form id="formRitimao">
            <div class="campo">
                <label>Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label>CPF</label>
                <input type="text" id="cpf" class="mask-cpf" required placeholder="000.000.000-00">
                <span class="msg-erro" id="erro-cpf">CPF Inválido</span>
            </div>

            <div class="campo">
                <label>Data de Nascimento</label>
                <input type="date" id="dataNasc" required>
                <span class="msg-erro" id="erro-idade">Mínimo 12 anos para participar</span>
            </div>

            <div id="sessao-responsavel" class="hidden">
                <div class="campo">
                    <label>Nome do Responsável</label>
                    <input type="text" id="nomeResp">
                </div>
                <div class="campo">
                    <label>WhatsApp do Responsável</label>
                    <input type="text" id="telResp" class="mask-tel">
                </div>
            </div>

            <div class="campo">
                <label>Sexo</label>
                <select id="sexo" required>
                    <option value="">Selecione...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                </select>
            </div>

            <div class="campo">
                <label>Seu WhatsApp</label>
                <input type="text" id="tel" class="mask-tel" required placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label>E-mail</label>
                <input type="email" id="email" required placeholder="exemplo@email.com">
                <span class="msg-erro" id="erro-email">E-mail inválido</span>
            </div>

            <div class="campo">
                <label>Instrumento Desejado</label>
                <select id="instrumento" required>
                    <option value="">Selecione o Sexo primeiro...</option>
                </select>
            </div>

            <div class="campo">
                <label>Nº Matrícula Sócio (Gaviões)</label>
                <input type="text" id="numSocio" class="mask-socio" required>
            </div>

            <div class="campo">
                <label>Foto da Carteirinha (Sócio)</label>
                <input type="file" id="imgSocio" accept="image/*" required>
            </div>
            <div class="campo">
                <label>Sua Foto de Perfil</label>
                <input type="file" id="imgPerfil" accept="image/*" required>
            </div>

            <button type="button" id="btnFinalizar" disabled>Verificar Vagas e Finalizar</button>
        </form>
    </div>

    <div id="modalPix">
        <div class="pix-content">
            <h3 style="color: var(--destaque)">VAGA RESERVADA! 🥁</h3>
            <p style="font-size: 0.9rem;">Para confirmar sua inscrição, realize o pagamento da taxa:</p>
            
            <img src="URL_DO_SEU_QR_CODE_AQUI" alt="QR Code PIX" style="width: 200px; background: white; padding: 10px; border-radius: 10px;">
            
            <p style="margin-top: 15px; font-size: 0.8rem;">Chave PIX (E-mail):<br><strong>financeiro@ritimao.com.br</strong></p>
            
            <div class="campo" style="margin-top: 20px;">
                <label>Anexe o Comprovante aqui</label>
                <input type="file" id="imgPix" accept="image/*">
            </div>
            
            <button id="btnEnviarTudo" style="background: var(--sucesso); color: #000;">ENVIAR COMPROVANTE AGORA</button>
        </div>
    </div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxtm0y_UXaIn8kua8IJJHPmopP8qqdUnw435jLp1HD0XPgcYNe8AIMIVA83tWOhgf5ngA/exec";
    const instrumentosBase = ["Caixa", "Chocalho", "Cuica", "Repique", "Surdo 1", "Surdo 2", "Surdo 3", "Tamborim", "Timbal", "Xequere"];

    $(document).ready(function(){
        $('.mask-cpf').mask('000.000.000-00');
        $('.mask-tel').mask('(00) 00000-0000');
        $('.mask-socio').mask('00000000');

        // Validação em tempo real
        $('#nome').on('blur', function() { validarCampo($(this), $(this).val().length > 3); });
        
        $('#cpf').on('blur', function() {
            const valido = validarCPF($(this).val());
            validarCampo($(this), valido, '#erro-cpf');
        });

        $('#dataNasc').on('change', function() {
            const idade = calcularIdade($(this).val());
            if (idade < 12) {
                validarCampo($(this), false, '#erro-idade');
            } else {
                validarCampo($(this), true, '#erro-idade');
                if (idade < 18) $('#sessao-responsavel').removeClass('hidden');
                else $('#sessao-responsavel').addClass('hidden');
            }
        });

        $('#email').on('blur', function() {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            validarCampo($(this), regex.test($(this).val()), '#erro-email');
        });

        $('#sexo').on('change', function() {
            const sexo = $(this).val();
            let html = '<option value="">Selecione...</option>';
            instrumentosBase.forEach(inst => {
                if (sexo === "Masculino" && (inst === "Chocalho" || inst === "Xequere")) return;
                html += `<option value="${inst}">${inst}</option>`;
            });
            $('#instrumento').html(html);
        });

        // Habilitar Botão
        $('input, select').on('change keyup', function() {
            const formValido = document.getElementById('formRitimao').checkValidity();
            $('#btnFinalizar').prop('disabled', !formValido);
        });

        // Lógica Finalizar
        $('#btnFinalizar').on('click', function() {
            $(this).text("VERIFICANDO VAGAS...").prop('disabled', true);
            
            $.getJSON(URL_SCRIPT, function(vagas) {
                const escolhido = $('#instrumento').val();
                if (vagas[escolhido] > 0) {
                    $('#area-formulario').fadeOut(300, () => $('#modalPix').css('display', 'flex'));
                } else {
                    alert("Infelizmente as vagas para " + escolhido + " acabaram de esgotar!");
                    location.reload();
                }
            });
        });

        $('#btnEnviarTudo').on('click', async function() {
            if (!$('#imgPix')[0].files[0]) return alert("Anexe o comprovante!");
            
            $(this).text("ENVIANDO...").prop('disabled', true);
            
            const payload = {
                nome: $('#nome').val(),
                cpf: $('#cpf').val(),
                idade: calcularIdade($('#dataNasc').val()),
                sexo: $('#sexo').val(),
                tel: $('#tel').val(),
                email: $('#email').val(),
                inst: $('#instrumento').val(),
                socio: $('#numSocio').val(),
                nomeResp: $('#nomeResp').val() || "N/A",
                telResp: $('#telResp').val() || "N/A",
                fotoPerfil: await converterBase64($('#imgPerfil')[0].files[0]),
                fotoSocio: await converterBase64($('#imgSocio')[0].files[0]),
                fotoPix: await converterBase64($('#imgPix')[0].files[0])
            };

            $.post(URL_SCRIPT, JSON.stringify(payload), function(r) {
                alert("Inscrição Realizada com Sucesso! Aguarde contato.");
                location.reload();
            });
        });
    });

    // Funções Auxiliares
    function validarCampo(el, condicao, erroEl) {
        if (condicao) { el.addClass('valido').removeClass('invalido'); $(erroEl).hide(); }
        else { el.addClass('invalido').removeClass('valido'); $(erroEl).show(); }
    }

    function calcularIdade(data) {
        const d = new Date(data);
        return Math.floor((new Date() - d) / 31557600000);
    }

    function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11 || /^(\d)\1{11}$/.test(cpf)) return false;
        let s = 0;
        for (let i=0; i<9; i++) s += parseInt(cpf.charAt(i)) * (10-i);
        let r = 11 - (s % 11);
        if (r == 10 || r == 11) r = 0;
        if (r != parseInt(cpf.charAt(9))) return false;
        s = 0;
        for (let i=0; i<10; i++) s += parseInt(cpf.charAt(i)) * (11-i);
        r = 11 - (s % 11);
        if (r == 10 || r == 11) r = 0;
        return r == parseInt(cpf.charAt(10));
    }

    function converterBase64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
