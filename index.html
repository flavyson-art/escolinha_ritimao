<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Ritimão 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #aaa; --destaque: #ffd700; --erro: #ff4444; }
        body, html { margin: 0; padding: 0; background-color: var(--preto); color: var(--branco); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* Telas */
        .tela { display: none; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* Garantir que a tela inicial apareça */
        #tela-inicial { display: flex ! Democratic; } 

        .container { width: 100%; max-width: 400px; background: #111; padding: 20px; border-radius: 15px; border: 1px solid #333; box-sizing: border-box; }
        
        .logo-btn { width: 200px; height: 200px; border-radius: 50%; border: 4px solid var(--branco); cursor: pointer; transition: 0.3s; z-index: 10; position: relative; }
        .logo-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--destaque); }

        .campo { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { font-size: 0.75rem; color: var(--cinza); margin-bottom: 4px; }
        input, select { padding: 10px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; }
        
        button { width: 100%; padding: 15px; background: var(--branco); color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="tela-inicial" class="tela">
        <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Logo.jpg" 
             class="logo-btn" 
             id="btn-iniciar"
             onerror="this.src='https://via.placeholder.com/200?text=CLIQUE+AQUI'">
        <h2 style="text-align:center; margin-top:20px;">TOQUE NO LOGO PARA INICIAR</h2>
    </div>

    <div id="tela-cadastro" class="tela" style="display:none;">
        <div class="container">
            <h3 style="color:var(--destaque); text-align:center;">CADASTRO</h3>
            <div id="status-vagas" style="font-size: 10px; text-align: center; margin-bottom: 10px;"></div>
            <form id="formMatricula">
                <div class="campo"><label>Nome</label><input type="text" id="nome" required></div>
                <div class="campo"><label>CPF</label><input type="text" id="cpf" class="mask-cpf" required></div>
                <div class="campo"><label>Sexo</label>
                    <select id="sexo" required onchange="atualizarInstrumentos()">
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>
                <div class="campo"><label>Instrumento</label>
                    <select id="instrumento" required></select>
                </div>
                <button type="submit" id="btnEnviar">AVANÇAR PARA PAGAMENTO</button>
            </form>
        </div>
    </div>

<script>
    // 1. Verifique se este link está correto (cole no navegador para testar)
    const URL_API = "https://script.google.com/macros/s/AKfycbxtm0y_UXaIn8kua8IJJHPmopP8qqdUnw435jLp1HD0XPgcYNe8AIMIVA83tWOhgf5ngA/exec";

    // FUNÇÃO DE TROCA DE TELA (JavaScript Puro - Não depende de jQuery)
    document.getElementById('btn-iniciar').addEventListener('click', function() {
        console.log("Clique detectado!");
        document.getElementById('tela-inicial').style.setProperty('display', 'none', 'important');
        document.getElementById('tela-cadastro').style.display = 'flex';
        carregarVagas();
    });

    async function carregarVagas() {
        const status = document.getElementById('status-vagas');
        status.innerHTML = "Sincronizando com a planilha...";
        try {
            const response = await fetch(URL_API);
            if (!response.ok) throw new Error("Erro 404 na API");
            window.vagas = await response.json();
            status.innerHTML = "✅ Vagas atualizadas";
            atualizarInstrumentos();
        } catch (e) {
            console.error(e);
            status.innerHTML = "⚠️ Erro ao conectar. Usando modo offline.";
            // Fallback para não travar o site
            window.vagas = {"Caixa":5, "Surdo":5, "Repique":5, "Chocalho":5};
            atualizarInstrumentos();
        }
    }

    function atualizarInstrumentos() {
        const sexo = document.getElementById('sexo').value;
        const select = document.getElementById('instrumento');
        let opcoes = '<option value="">Selecione...</option>';
        
        for (let inst in window.vagas) {
            // Regra de segurança: Masculino não vê Chocalho/Xequere
            if (sexo === "Masculino" && (inst === "Chocalho" || inst === "Xequere")) continue;
            opcoes += `<option value="${inst}">${inst} (${window.vagas[inst]} vagas)</option>`;
        }
        select.innerHTML = opcoes;
    }

    // Máscaras (Dependem do jQuery)
    $(document).ready(function(){
        if($.isFunction($('.mask-cpf').mask)) {
            $('.mask-cpf').mask('000.000.000-00');
        }
    });
</script>
</body>
</html>
