<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Ritimão 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #aaa; --destaque: #ffd700; --erro: #ff4444; --sucesso: #00ff00; }
        body, html { margin: 0; padding: 0; background-color: var(--preto); color: var(--branco); font-family: 'Segoe UI', sans-serif; }
        
        .tela { display: none; padding: 20px; min-height: 100vh; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box; background-size: cover; background-position: center; background-attachment: fixed; }
        
        /* Imagens de Fundo */
        #tela-inicial { display: flex; justify-content: center; }
        #tela-cadastro { background-image: url('https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Fundo_tela_Cadastro.jpg'); }
        #tela-pix { background-color: #111; display: none; }

        .logo-btn { width: 300px; height: 300px; border-radius: 50%; border: 6px solid var(--branco); cursor: pointer; transition: 0.3s; z-index: 10; object-fit: cover; }
        .logo-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--destaque); }

        .container { width: 100%; max-width: 450px; background: rgba(0, 0, 0, 0.9); padding: 25px; border-radius: 15px; border: 1px solid #333; box-sizing: border-box; margin: 20px 0; }
        
        .titulo-amarelo { color: var(--destaque); text-align: center; text-transform: uppercase; font-weight: 900; margin-bottom: 20px; }
        
        .grid-vagas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #222; padding: 15px; border-radius: 10px; font-size: 13px; }
        .vaga-item { border-bottom: 1px solid #444; padding: 5px; display: flex; justify-content: space-between; }
        .esgotado { color: var(--erro); font-weight: bold; }

        .aviso-tamborim { background: rgba(255, 68, 68, 0.2); border: 1px solid var(--erro); padding: 10px; border-radius: 5px; font-size: 12px; margin-bottom: 15px; text-align: center; }

        .campo { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.8rem; color: var(--cinza); margin-bottom: 5px; }
        input, select { padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 1rem; }
        
        .btn-acao { width: 100%; padding: 18px; background: var(--branco); color: #000; border: none; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-acao:disabled { background: #555; cursor: not-allowed; }

        #qr-code { width: 100%; max-width: 300px; margin: 20px 0; border: 5px solid white; border-radius: 10px; }
        .chave-pix { background: #222; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.1rem; color: var(--destaque); margin: 10px 0; border: 1px dashed #555; }
    </style>
</head>
<body>

    <div id="tela-inicial" class="tela">
        <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Logo.jpg" class="logo-btn" onclick="abrirCadastro()">
        <h2 style="text-align:center; margin-top:25px;">TOQUE NO LOGO PARA INICIAR</h2>
    </div>

    <div id="tela-cadastro" class="tela">
        <div class="container">
            <h2 class="titulo-amarelo">Inscrições Abertas para Sócios</h2>
            
            <div id="vagas-container" class="grid-vagas">
                </div>

            <div class="aviso-tamborim">
                <strong>AVISO IMPORTANTE:</strong> Para as aulas de Tamborim, é obrigatório possuir e trazer seu próprio instrumento.
            </div>

            <form id="formMatricula">
                <div class="campo"><label>Nome Completo *</label><input type="text" id="nome" required></div>
                <div class="campo"><label>CPF *</label><input type="text" id="cpf" class="mask-cpf" required></div>
                <div class="campo"><label>Data de Nascimento *</label><input type="text" id="nasc" class="mask-data" placeholder="DD/MM/AAAA" onblur="validarIdade()" required></div>
                
                <div id="campos-responsavel" style="display:none; border-left: 3px solid var(--destaque); padding-left: 10px; margin-bottom: 15px;">
                    <div class="campo"><label>Nome do Responsável *</label><input type="text" id="nomeResp"></div>
                    <div class="campo"><label>Telefone do Responsável *</label><input type="text" id="telResp" class="mask-tel"></div>
                </div>

                <div class="campo"><label>Sexo *</label>
                    <select id="sexo" onchange="atualizarInstrumentos()" required>
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>

                <div class="campo"><label>WhatsApp *</label><input type="text" id="tel" class="mask-tel" required></div>
                <div class="campo"><label>E-mail *</label><input type="email" id="email" required></div>
                <div class="campo"><label>Rede Social</label><input type="text" id="social" placeholder="@usuario"></div>
                
                <div class="campo"><label>Instrumento *</label><select id="instrumento" required></select></div>
                
                <div class="campo"><label>Nível de Conhecimento *</label>
                    <select id="nivel" required>
                        <option value="">Selecione...</option>
                        <option value="Iniciante">Iniciante (Nunca tocou)</option>
                        <option value="Intermediário">Intermediário</option>
                        <option value="Avançado">Avançado</option>
                    </select>
                </div>

                <div class="campo"><label>Tamanho da Camiseta *</label>
                    <select id="camiseta" required>
                        <option value="">Selecione...</option>
                        <option value="P">P</option><option value="M">M</option>
                        <option value="G">G</option><option value="GG">GG</option>
                        <option value="XG">XG</option>
                    </select>
                </div>

                <div class="campo"><label>Nº Sócio Gaviões *</label><input type="number" id="numSocio" required></div>
                
                <div class="campo"><label>Foto Carteirinha/Recibo *</label><input type="file" id="fotoSocio" accept="image/*" required></div>
                <div class="campo"><label>Foto de Perfil *</label><input type="file" id="fotoPerfil" accept="image/*" required></div>

                <button type="submit" class="btn-acao" id="btnReservar">Reservar Vaga</button>
            </form>
        </div>
    </div>

    <div id="tela-pix" class="tela">
        <div class="container" style="text-align: center;">
            <h2 class="titulo-amarelo">Pagamento da Taxa</h2>
            <p>Valor: R$ 50,00</p>
            <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/QR_Cod.jpg" id="qr-code">
            <div class="chave-pix">carnaval@gavioes.com.br</div>
            
            <div class="campo" style="margin-top: 20px;">
                <label>Anexar Comprovante PIX *</label>
                <input type="file" id="fotoPix" accept="image/*" required>
            </div>
            <button class="btn-acao" onclick="enviarPix()" id="btnEnviarPix">Enviar Comprovante</button>
        </div>
    </div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbxtm0y_UXaIn8kua8IJJHPmopP8qqdUnw435jLp1HD0XPgcYNe8AIMIVA83tWOhgf5ngA/exec";
    let dadosCandidato = {};

    function abrirCadastro() {
        $(".tela").hide();
        $("#tela-cadastro").css("display", "flex");
        carregarVagas();
    }

    async function carregarVagas() {
        try {
            const res = await fetch(URL_API);
            window.vagas = await res.json();
            let html = "";
            for (let i in window.vagas) {
                let qtd = window.vagas[i];
                html += `<div class="vaga-item">${i}: ${qtd > 0 ? qtd : '<span class="esgotado">Esgotado</span>'}</div>`;
            }
            $("#vagas-container").html(html);
            atualizarInstrumentos();
        } catch (e) { alert("Erro ao carregar vagas. Verifique sua conexão."); }
    }

    function validarIdade() {
        const dataStr = $("#nasc").val();
        if(dataStr.length < 10) return;
        
        const partes = dataStr.split("/");
        const nasc = new Date(partes[2], partes[1] - 1, partes[0]);
        const hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        if (new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()) < new Date(hoje.getFullYear(), nasc.getMonth(), nasc.getDate())) idade--;

        if (idade < 12) {
            alert("Inscrições apenas para maiores de 12 anos.");
            $("#nasc").val("");
        } else if (idade < 18) {
            $("#campos-responsavel").show();
            $("#nomeResp, #telResp").prop("required", true);
        } else {
            $("#campos-responsavel").hide();
            $("#nomeResp, #telResp").prop("required", false);
        }
    }

    function atualizarInstrumentos() {
        const sexo = $("#sexo").val();
        let html = '<option value="">Selecione...</option>';
        for (let i in window.vagas) {
            if (sexo === "Masculino" && (i === "Xequere" || i === "Chocalho")) continue;
            let esgotado = window.vagas[i] <= 0;
            html += `<option value="${i}" ${esgotado ? 'disabled' : ''}>${i} ${esgotado ? '(ESGOTADO)' : ''}</option>`;
        }
        $("#instrumento").html(html);
    }

    // Máscaras
    $(document).ready(function(){
        $('.mask-cpf').mask('000.000.000-00');
        $('.mask-data').mask('00/00/0000');
        $('.mask-tel').mask('(00) 00000-0000');
    });

    // Submissão do Formulário
    $("#formMatricula").on("submit", async function(e) {
        e.preventDefault();
        $("#btnReservar").prop("disabled", true).text("Processando...");

        // Conversão de fotos para Base64
        const fileSocio = document.getElementById("fotoSocio").files[0];
        const filePerfil = document.getElementById("fotoPerfil").files[0];

        dadosCandidato = {
            acao: "RESERVAR",
            nome: $("#nome").val(),
            cpf: $("#cpf").val(),
            nasc: $("#nasc").val(),
            sexo: $("#sexo").val(),
            tel: $("#tel").val(),
            email: $("#email").val(),
            social: $("#social").val(),
            instrumento: $("#instrumento").val(),
            nivel: $("#nivel").val(),
            camiseta: $("#camiseta").val(),
            numSocio: $("#numSocio").val(),
            nomeResp: $("#nomeResp").val() || "N/A",
            telResp: $("#telResp").val() || "N/A",
            fotoSocio: await toBase64(fileSocio),
            fotoPerfil: await toBase64(filePerfil)
        };

        try {
            const res = await fetch(URL_API, { method: "POST", body: JSON.stringify(dadosCandidato) });
            const final = await res.json();
            if (final.status === "sucesso") {
                $(".tela").hide();
                $("#tela-pix").css("display", "flex");
            } else {
                alert(final.msg);
                if(final.msg.includes("vagas")) window.location.reload();
            }
        } catch (e) { alert("Erro ao enviar. Tente novamente."); }
        $("#btnReservar").prop("disabled", false).text("Reservar Vaga");
    });

    async function enviarPix() {
        const file = document.getElementById("fotoPix").files[0];
        if(!file) return alert("Anexe o comprovante!");
        
        $("#btnEnviarPix").prop("disabled", true).text("Enviando...");
        const payload = { acao: "CONFIRMAR_PAGAMENTO", cpf: dadosCandidato.cpf, comprovante: await toBase64(file) };
        
        try {
            await fetch(URL_API, { method: "POST", body: JSON.stringify(payload) });
            alert("COMPROVANTE ENVIADO! Sua inscrição foi recebida com sucesso. A Diretoria da Ritimão irá validar seu comprovante e entrará em contato.");
            window.location.reload();
        } catch (e) { alert("Erro ao enviar comprovante."); }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
</script>
</body>
</html>
