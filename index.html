<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Ritimão 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #aaa; --destaque: #ffd700; --erro: #ff4444; }
        body, html { margin: 0; padding: 0; background-color: var(--preto); color: var(--branco); font-family: 'Segoe UI', sans-serif; }
        
        #tela-cadastro { 
            display: none; padding: 20px; min-height: 100vh; position: relative;
            background-image: url("https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Fundo_tela_Cadastro.jpg");
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        #tela-cadastro::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: 1;
        }

        .container { 
            max-width: 450px; margin: 0 auto; background: rgba(17, 17, 17, 0.9);
            padding: 25px; border-radius: 15px; border: 1px solid #333; position: relative; z-index: 2;
        }
        
        #tela-inicial { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center; cursor: pointer; }
        .logo-ritimao { width: 220px; border-radius: 50%; border: 5px solid var(--branco); margin: 20px; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        #tela-pix, #tela-final { display: none; padding: 20px; min-height: 100vh; }
        
        .quadro-vagas { background: #000; padding: 12px; border-radius: 8px; border: 1px solid #222; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.7rem; }
        .vaga-item { display: flex; justify-content: space-between; padding: 2px 5px; border-bottom: 1px solid #111; }
        .vaga-zero { color: var(--erro); font-weight: bold; }
        .aviso-tamborim { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--destaque); color: var(--destaque); padding: 12px; border-radius: 8px; font-size: 0.8rem; margin: 15px 0 25px 0; text-align: center; }
        .timer-box { background: var(--erro); color: white; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; display: inline-block; width: 100%; box-sizing: border-box; }
        .valor-pix { font-size: 1.8rem; color: var(--branco); font-weight: 900; margin: 10px 0; border-bottom: 2px solid var(--destaque); display: inline-block; padding-bottom: 5px; }
        .campo { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; color: var(--cinza); font-weight: bold; }
        input, select { padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 0.9rem; }
        button { width: 100%; padding: 16px; background: var(--branco); color: var(--preto); border: none; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        button:disabled { background: #444; cursor: not-allowed; color: #888; }
        .hidden { display: none; }
        .qr-code { background: #fff; padding: 10px; width: 180px; height: 180px; margin: 15px auto; border-radius: 10px; }
        .chave-pix { font-family: monospace; font-size: 0.8rem; word-break: break-all; background: #222; padding: 12px; border-radius: 5px; margin: 10px 0; border: 1px dashed #555; color: var(--destaque); }
    </style>
</head>
<body>

    <div id="tela-inicial" onclick="abrirCadastro()">
        <h1 style="font-size: 2.5rem; margin: 0;">RITIMÃO</h1>
        <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Logo.jpg" class="logo-ritimao">
        <p style="letter-spacing: 2px;">TOQUE PARA COMEÇAR</p>
    </div>

    <div id="tela-cadastro">
        <div class="container">
            <h2 style="text-align:center; margin-top: 0; color: var(--destaque);">INSCRIÇÃO 2026</h2>
            <div id="vagasDisplay" class="quadro-vagas"></div>
            <div class="aviso-tamborim">
                ⚠️ <strong>AVISO:</strong> Instrumento próprio obrigatório para <strong>Tamborim</strong>.
            </div>
            <form id="formMatricula">
                <div class="campo"><label>Nome Completo</label><input type="text" id="nome" required></div>
                <div class="campo"><label>CPF</label><input type="text" id="cpf" class="mask-cpf" required></div>
                <div class="campo"><label>Nascimento</label><input type="text" id="dataNasc" class="mask-data" placeholder="DD/MM/AAAA" required></div>
                
                <div id="dadosResponsavel" class="hidden">
                    <div class="campo"><label>Responsável</label><input type="text" id="nomeResp"></div>
                    <div class="campo"><label>WhatsApp Resp.</label><input type="text" id="telResp" class="mask-tel"></div>
                </div>

                <div class="campo"><label>Sexo</label>
                    <select id="sexo" required>
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>

                <div class="campo"><label>WhatsApp</label><input type="text" id="tel" class="mask-tel" required></div>
                <div class="campo"><label>E-mail</label><input type="email" id="email" required></div>
                <div class="campo"><label>Rede Social</label><input type="text" id="redeSocial" placeholder="@seuuser" required></div>
                
                <div class="campo">
                    <label>Instrumento</label>
                    <select id="instrumento" required><option value="">Selecione o sexo primeiro...</option></select>
                </div>

                <div class="campo hidden" id="campoNivel">
                    <label>Nível</label>
                    <select id="nivel"><option value="">Selecione...</option></select>
                </div>

                <div class="campo"><label>Nº Sócio (Gaviões)</label><input type="text" id="campoNumSocio" class="mask-numero" required></div>
                <div class="campo"><label>Foto Carteirinha/Recibo</label><input type="file" id="fotoSocio" accept="image/*" required></div>
                <div class="campo"><label>Sua Foto de Perfil</label><input type="file" id="foto" accept="image/*" required></div>
                
                <button type="submit" id="btnEnviar">RESERVAR VAGA</button>
            </form>
        </div>
    </div>

    <div id="tela-pix">
        <div class="container" style="text-align: center;">
            <div class="timer-box">Expira em: <span id="timer">05:00</span></div>
            <h2 style="color:var(--destaque); margin-bottom:0">PAGAMENTO</h2>
            <div class="valor-pix">R$ 50,00</div>
            <div class="qr-code"><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=aa16b3ae-567b-4a15-87f5-98abe8650a93" width="180"></div>
            <div class="chave-pix">aa16b3ae-567b-4a15-87f5-98abe8650a93</div>
            
            <div class="campo" style="margin-top: 20px; text-align: left;">
                <label>Anexar Comprovante PIX</label>
                <input type="file" id="fotoComprovante" accept="image/*" required>
            </div>
            
            <button id="btnConfirmarPix" onclick="confirmarPagamento()">ENVIAR COMPROVANTE</button>
        </div>
    </div>

    <div id="tela-final">
        <div class="container" style="text-align:center">
            <h1 style="font-size: 4rem;">🥁</h1>
            <h2 style="color:var(--destaque)">INSCRIÇÃO CONCLUÍDA!</h2>
            <p>Sua vaga está garantida.</p>
            <button onclick="location.reload()" style="background:#333; color:#fff">FECHAR</button>
        </div>
    </div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxtm0y_UXaIn8kua8IJJHPmopP8qqdUnw435jLp1HD0XPgcYNe8AIMIVA83tWOhgf5ngA/exec";
    let dadosTemp = {};
    let intervaloTimer;

    const NIVEIS = {
        "Chocalho": ["Iniciante", "Intermediário"],
        "Xequere": ["Iniciante", "Intermediário"],
        "Repique": ["Iniciante", "Intermediário"],
        "Caixa": ["Iniciante", "Intermediário"],
        "Surdo 3": ["Iniciante", "Intermediário"],
        "Tamborim": ["Iniciante", "Intermediário", "Curso de aprimoramento (para quem já toca)"],
        "Cuica": ["Iniciante", "Intermediário", "Curso de aprimoramento (para quem já toca)"],
        "Timbal": ["Iniciante", "Intermediário", "Curso de aprimoramento (para quem já toca)"],
        "Surdo 1": ["Curso de aprimoramento (para quem já toca)"],
        "Surdo 2": ["Curso de aprimoramento (para quem já toca)"]
    };

    $(document).ready(function(){
        $('.mask-cpf').mask('000.000.000-00');
        $('.mask-tel').mask('(00) 00000-0000');
        $('.mask-numero').mask('00000000');
        $('.mask-data').mask('00/00/0000');

        $('#sexo').on('change', function() { 
            $('#campoNivel').addClass('hidden'); // Esconde nível ao mudar sexo
            atualizarVagas($(this).val()); 
        });

        $('#instrumento').on('change', function() {
            const inst = $(this).val();
            const campoNivel = $('#campoNivel');
            const selectNivel = $('#nivel');
            if (inst && NIVEIS[inst]) {
                let options = '<option value="">Selecione o nível...</option>';
                NIVEIS[inst].forEach(n => options += `<option value="${n}">${n}</option>`);
                selectNivel.html(options).prop('required', true);
                campoNivel.removeClass('hidden');
            } else {
                campoNivel.addClass('hidden');
            }
        });
    });

    function abrirCadastro() { $('#tela-inicial').fadeOut(300, () => $('#tela-cadastro').fadeIn()); }

    async function atualizarVagas(sexo = "") {
        const res = await $.get(URL_SCRIPT);
        let hVagas = ""; 
        let hSelect = '<option value="">Selecione...</option>';
        
        for (let inst in res) {
            let lotado = res[inst] <= 0;
            let nomeExibicao = inst === "Surdo 3" ? "Terceira" : inst;
            
            // LÓGICA DE RESTRIÇÃO DE SEXO FIXADA
            let restrito = (sexo === "Masculino" && (inst === "Chocalho" || inst === "Xequere"));
            
            hVagas += `<div class="vaga-item"><span>${nomeExibicao}:</span><span class="${lotado?'vaga-zero':''}">${lotado?'LOTADO':res[inst]}</span></div>`;
            
            if (!restrito) {
                hSelect += `<option value="${inst}" ${lotado?'disabled':''}>${nomeExibicao} ${lotado?'(LOTADO)':''}</option>`;
            }
        }
        $('#vagasDisplay').html(hVagas); 
        $('#instrumento').html(hSelect);
    }

    $('#formMatricula').on('submit', async function(e) {
        e.preventDefault();
        const btn = $('#btnEnviar');
        btn.prop('disabled', true).text('PROCESSANDO...');
        
        dadosTemp = {
            nome: $('#nome').val(), cpf: $('#cpf').val(), idade: calcularIdade($('#dataNasc').val()),
            sexo: $('#sexo').val(), telefone: $('#tel').val(), email: $('#email').val(),
            redeSocial: $('#redeSocial').val(), instrumento: $('#instrumento').val(),
            nivel: $('#nivel').val(), numSocio: $('#campoNumSocio').val(),
            nomeResp: $('#nomeResp').val() || "N/A", telResp: $('#telResp').val() || "N/A",
            fotoBase64: await converterImagem($('#foto')[0].files[0]),
            fotoSocioBase64: await converterImagem($('#fotoSocio')[0].files[0]),
            acao: "RESERVAR"
        };

        $.post(URL_SCRIPT, JSON.stringify(dadosTemp), function(res) {
            if(res.status === "sucesso") { 
                $('#tela-cadastro').fadeOut(300, () => { $('#tela-pix').fadeIn(); startTimer(300, document.querySelector('#timer')); });
            } else { alert(res.msg); btn.prop('disabled', false).text('RESERVAR VAGA'); }
        });
    });

    async function confirmarPagamento() {
        const fileComp = $('#fotoComprovante')[0].files[0];
        if(!fileComp) return alert("Por favor, anexe o comprovante!");
        const btn = $('#btnConfirmarPix');
        btn.prop('disabled', true).text('ENVIANDO...');
        
        const b64Comp = await converterImagem(fileComp);
        const pFinal = {
            cpf: dadosTemp.cpf, instrumento: dadosTemp.instrumento,
            fotoComprovante: b64Comp, acao: "CONFIRMAR_PAGAMENTO"
        };

        $.post(URL_SCRIPT, JSON.stringify(pFinal), function(res) {
            if(res.status === "sucesso") { clearInterval(intervaloTimer); $('#tela-pix').fadeOut(300, () => $('#tela-final').fadeIn()); }
            else { alert(res.msg); location.reload(); }
        });
    }

    function startTimer(duration, display) {
        let timer = duration, min, sec;
        intervaloTimer = setInterval(() => {
            min = parseInt(timer / 60, 10); sec = parseInt(timer % 60, 10);
            display.textContent = (min < 10 ? "0"+min : min) + ":" + (sec < 10 ? "0"+sec : sec);
            if (--timer < 0) { clearInterval(intervaloTimer); alert("Tempo expirado!"); location.reload(); }
        }, 1000);
    }

    function calcularIdade(s) {
        const p = s.split('/'); const n = new Date(p[2], p[1]-1, p[0]); const h = new Date();
        let i = h.getFullYear() - n.getFullYear();
        if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) i--;
        return i;
    }

    function converterImagem(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }

    function validarCPF(c) {
        c = c.replace(/\D/g, ''); if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
        let s = 0, r;
        for (let i = 1; i <= 9; i++) s += parseInt(c[i-1]) * (11 - i);
        r = (s * 10) % 11; if (r === 10 || r === 11) r = 0;
        if (r !== parseInt(c[9])) return false;
        s = 0; for (let i = 1; i <= 10; i++) s += parseInt(c[i-1]) * (12 - i);
        r = (s * 10) % 11; if (r === 10 || r === 11) r = 0;
        return r === parseInt(c[10]);
    }
</script>
</body>
</html>
