<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Ritimão 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #aaa; --destaque: #ffd700; --erro: #ff4444; }
        body, html { margin: 0; padding: 0; background-color: var(--preto); color: var(--branco); font-family: 'Segoe UI', sans-serif; }
        
        .tela { display: none; padding: 20px; min-height: 100vh; position: relative; background-size: cover; background-position: center; background-attachment: fixed; }
        #tela-inicial { display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        
        /* Overlay escuro para legibilidade */
        .tela::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1; }
        
        .container { max-width: 480px; margin: 0 auto; background: rgba(15, 15, 15, 0.95); padding: 25px; border-radius: 20px; border: 1px solid #333; position: relative; z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .logo-btn { width: 280px; height: 280px; border-radius: 50%; border: 6px solid var(--branco); object-fit: cover; box-shadow: 0 0 40px rgba(255,255,255,0.2); transition: 0.3s; }
        .logo-btn:active { transform: scale(0.95); }

        .quadro-vagas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; background: #000; padding: 12px; border-radius: 10px; font-size: 0.8rem; border: 1px solid #222; }
        .vaga-item { border-bottom: 1px solid #111; display: flex; justify-content: space-between; padding: 2px 0; }
        .vaga-zero { color: var(--erro); font-weight: bold; }
        
        .campo { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px; color: var(--cinza); font-weight: bold; }
        input, select { padding: 12px; background: #080808; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 1rem; }
        input:focus { border-color: var(--destaque); outline: none; }
        
        button { width: 100%; padding: 18px; background: var(--branco); color: var(--preto); border: none; font-weight: 900; border-radius: 10px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        
        .qr-code-img { width: 260px; background: #fff; padding: 10px; border-radius: 10px; margin: 15px auto; display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="tela-inicial" class="tela" style="display: flex;">
        <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Logo.jpg" class="logo-btn" onclick="abrirCadastro()">
        <p style="margin-top:20px; font-weight: bold; z-index: 2; letter-spacing: 2px; text-align: center;">TOQUE NO LOGO PARA INICIAR</p>
    </div>

    <div id="tela-cadastro" class="tela">
        <div class="container">
            <h2 style="text-align:center; color: var(--destaque); margin-top:0;">INSCRIÇÃO SÓCIOS</h2>
            <div id="vagasDisplay" class="quadro-vagas">Sincronizando vagas...</div>
            
            <form id="formMatricula">
                <div class="campo"><label>Nome Completo *</label><input type="text" id="nome" required></div>
                <div class="campo"><label>CPF *</label><input type="text" id="cpf" class="mask-cpf" required></div>
                <div class="campo"><label>Nascimento *</label><input type="text" id="dataNasc" class="mask-data" placeholder="DD/MM/AAAA" required></div>
                
                <div id="blocoResp" class="hidden">
                    <div class="campo"><label style="color:var(--destaque)">Nome do Responsável *</label><input type="text" id="nomeResp"></div>
                    <div class="campo"><label style="color:var(--destaque)">WhatsApp do Responsável *</label><input type="text" id="telResp" class="mask-tel"></div>
                </div>

                <div class="campo"><label>Sexo *</label>
                    <select id="sexo" required>
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>

                <div class="campo"><label>WhatsApp *</label><input type="text" id="tel" class="mask-tel" required></div>
                <div class="campo"><label>E-mail *</label><input type="email" id="email" required></div>
                <div class="campo"><label>Rede Social (Instagram/Facebook)</label><input type="text" id="redeSocial" placeholder="@usuario"></div>
                
                <div class="campo"><label>Instrumento *</label>
                    <select id="instrumento" required><option value="">Selecione o sexo primeiro</option></select>
                </div>

                <div class="campo"><label>Nível *</label>
                    <select id="nivel" required>
                        <option value="Iniciante">Iniciante</option>
                        <option value="Intermediário">Intermediário</option>
                        <option value="Avançado">Avançado</option>
                    </select>
                </div>

                <div class="campo"><label>Tamanho Camiseta *</label>
                    <select id="tamanhoCamiseta" required>
                        <option value="P">P</option><option value="M">M</option><option value="G">G</option><option value="GG">GG</option><option value="EXG">EXG</option>
                    </select>
                </div>

                <div class="campo"><label>Nº Sócio Gaviões *</label><input type="number" id="numSocio" required></div>
                <div class="campo"><label>Foto Carteirinha (Sócio) *</label><input type="file" id="fotoSocio" accept="image/*" required></div>
                <div class="campo"><label>Sua Foto (Perfil) *</label><input type="file" id="fotoPerfil" accept="image/*" required></div>

                <button type="submit" id="btnReservar">RESERVAR VAGA</button>
            </form>
        </div>
    </div>

    <div id="tela-pix" class="tela">
        <div class="container" style="text-align: center;">
            <div style="background:var(--erro); padding:10px; border-radius:8px; font-weight:bold; margin-bottom:15px">RESERVA EXPIRA EM: <span id="timer">05:00</span></div>
            <h2 style="color:var(--destaque)">PAGAMENTO PIX</h2>
            <p>Taxa de Matrícula: <strong>R$ 50,00</strong></p>
            <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/QR_Cod.jpg" class="qr-code-img">
            <p style="font-family:monospace; font-size:0.9rem; background:#111; padding:10px;">carnaval@gavioes.com.br</p>
            
            <div class="campo" style="text-align:left; margin-top:20px;">
                <label>Anexar Comprovante PIX *</label>
                <input type="file" id="fotoComprovante" accept="image/*" required>
            </div>
            <button onclick="enviarComprovante()" id="btnComprovante">ENVIAR COMPROVANTE</button>
        </div>
    </div>

    <div id="tela-final" class="tela">
        <div class="container" style="text-align: center;">
            <h1 style="font-size:4rem">✅</h1>
            <h2 style="color:var(--destaque)">SUCESSO!</h2>
            <p>Seus dados e comprovante foram enviados para análise da Diretoria.</p>
            <button onclick="location.reload()">SAIR</button>
        </div>
    </div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxtm0y_UXaIn8kua8IJJHPmopP8qqdUnw435jLp1HD0XPgcYNe8AIMIVA83tWOhgf5ngA/exec";
    let dadosUsuario = {};
    let timerId;

    // PASSO 3: LÓGICA BLINDADA PARA ABRIR O SITE SEM TRAVAR
    async function abrirCadastro() {
        console.log("Iniciando transição de tela...");
        
        // 1. Muda a tela PRIMEIRO (Ação instantânea para o usuário)
        $('#tela-inicial').hide();
        $('#tela-cadastro').fadeIn();
        
        // 2. Tenta carregar as vagas em segundo plano
        try {
            const res = await fetch(URL_SCRIPT);
            if (!res.ok) throw new Error("Erro 404 ou de conexão");
            
            window.vagas = await res.json();
            renderizarQuadroVagas();
        } catch (erro) {
            console.error("Falha ao sincronizar vagas:", erro);
            // Se der erro, preenchemos com algo básico para não deixar o campo vazio
            $('#vagasDisplay').html("<p style='color:var(--destaque); grid-column: 1/-1; text-align:center;'>⚠️ Sistema Online (Vagas em atualização)</p>");
            
            // Força uma lista padrão para o formulário funcionar
            window.vagas = {"Caixa":2,"Cuica":2,"Chocalho":2,"Repique":2,"Surdo 1":2,"Surdo 2":2,"Tamborim":2};
            atualizarFiltroInstrumento($('#sexo').val());
        }
    }

    // Função para desenhar o quadro de vagas na tela
    function renderizarQuadroVagas() {
        let html = "";
        for(let i in window.vagas) {
            html += `<div class="vaga-item"><span>${i}:</span><span class="${window.vagas[i]<=0?'vaga-zero':''}">${window.vagas[i]}</span></div>`;
        }
        $('#vagasDisplay').html(html);
        atualizarFiltroInstrumento($('#sexo').val());
    }

    $(document).ready(function(){
        $('.mask-cpf').mask('000.000.000-00');
        $('.mask-tel').mask('(00) 00000-0000');
        $('.mask-data').mask('00/00/0000');

        $('#dataNasc').blur(function(){
            const idade = calcularIdade($(this).val());
            if(idade > 0 && idade < 12) { alert("Mínimo 12 anos."); $(this).val(""); }
            else if(idade < 18) $('#blocoResp').show();
            else $('#blocoResp').hide();
        });

        $('#sexo').change(function(){ atualizarFiltroInstrumento($(this).val()); });
    });

    function atualizarFiltroInstrumento(sexo) {
        let h = '<option value="">Selecione...</option>';
        const lista = window.vagas || {"Caixa":1,"Repique":1,"Surdo 1":1,"Surdo 2":1,"Tamborim":1};
        for(let i in lista) {
            const restrito = (sexo === "Masculino" && (i === "Xequere" || i === "Chocalho"));
            if(!restrito) h += `<option value="${i}">${i}</option>`;
        }
        $('#instrumento').html(h);
    }

    function calcularIdade(data) {
        const p = data.split('/'); if(p.length<3) return 0;
        const n = new Date(p[2], p[1]-1, p[0]);
        let idade = new Date().getFullYear() - n.getFullYear();
        return idade;
    }

    $('#formMatricula').submit(async function(e){
        e.preventDefault();
        $('#btnReservar').prop('disabled', true).text('PROCESSANDO...');
        
        dadosUsuario = {
            nome: $('#nome').val(),
            cpf: $('#cpf').val().replace(/\D/g,''),
            dataNasc: $('#dataNasc').val(),
            sexo: $('#sexo').val(),
            tel: $('#tel').val(),
            email: $('#email').val(),
            redeSocial: $('#redeSocial').val() || "Não informado",
            instrumento: $('#instrumento').val(),
            nivel: $('#nivel').val(),
            tamanhoCamiseta: $('#tamanhoCamiseta').val(),
            numSocio: $('#numSocio').val(),
            nomeResp: $('#nomeResp').val() || "N/A",
            telResp: $('#telResp').val() || "N/A",
            fotoSocio: await toB64($('#fotoSocio')[0].files[0]),
            fotoPerfil: await toB64($('#fotoPerfil')[0].files[0]),
            acao: "RESERVAR"
        };

        try {
            const res = await fetch(URL_SCRIPT, { method: 'POST', body: JSON.stringify(dadosUsuario) });
            const r = await res.json();
            if(r.status === "sucesso") {
                $('#tela-cadastro').hide();
                $('#tela-pix').fadeIn();
                iniciarTimer();
            } else {
                alert(r.msg);
                $('#btnReservar').prop('disabled', false).text('RESERVAR VAGA');
            }
        } catch(e) {
            alert("Erro de conexão. Verifique se o Script foi publicado corretamente.");
            $('#btnReservar').prop('disabled', false).text('RESERVAR VAGA');
        }
    });

    async function enviarComprovante() {
        const f = $('#fotoComprovante')[0].files[0];
        if(!f) return alert("Selecione a foto do comprovante");
        
        $('#btnComprovante').prop('disabled', true).text('ENVIANDO...');
        try {
            const res = await fetch(URL_SCRIPT, { 
                method: 'POST', 
                body: JSON.stringify({ cpf: dadosUsuario.cpf, comprovante: await toB64(f), acao: "CONFIRMAR_PAGAMENTO" }) 
            });
            const r = await res.json();
            if(r.status === "sucesso") {
                clearInterval(timerId);
                $('#tela-pix').hide();
                $('#tela-final').fadeIn();
            }
        } catch(e) {
            alert("Erro ao enviar. Tente novamente.");
            $('#btnComprovante').prop('disabled', false).text('ENVIAR COMPROVANTE');
        }
    }

    function toB64(f) { return new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(f); }); }

    function iniciarTimer() {
        let t = 300;
        timerId = setInterval(() => {
            t--;
            let m = Math.floor(t/60), s = t%60;
            $('#timer').text(`${m}:${s<10?'0'+s:s}`);
            if(t<=0) { clearInterval(timerId); alert("Tempo esgotado!"); location.reload(); }
        }, 1000);
    }
</script>
</body>
</html>
