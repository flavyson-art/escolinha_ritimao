<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Ritimão 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #aaa; --destaque: #ffd700; --erro: #ff4444; --sucesso: #00bfff; }
        body, html { margin: 0; padding: 0; background-color: var(--preto); color: var(--branco); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        .tela { display: none; padding: 20px; min-height: 100vh; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box; background-size: cover; background-position: center; background-attachment: fixed; }
        
        #tela-inicial { display: flex; justify-content: center; align-items: center; }

        .logo-btn { 
            width: 90vw; 
            max-width: 600px; 
            height: auto; 
            aspect-ratio: 1/1;
            border-radius: 48%; 
            border: 10px solid var(--branco); 
            cursor: pointer; 
            transition: 0.4s; 
            object-fit: cover; 
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
            display: block;
            margin: 0 auto;
        }
        .logo-btn:hover { transform: scale(1.02); box-shadow: 0 0 50px var(--destaque); }

        #tela-cadastro { background-image: url('https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Fundo_tela_Cadastro.jpg'); }

        .container { width: 100%; max-width: 480px; background: rgba(0, 0, 0, 0.94); padding: 30px; border-radius: 20px; border: 1px solid #444; box-sizing: border-box; margin: 20px 0; position: relative; z-index: 2; }
        
        #tela-pix .container { max-width: 700px; }

        .titulo-amarelo { color: var(--destaque); text-align: center; text-transform: uppercase; font-weight: 900; font-size: 1.6rem; margin-top: 0; margin-bottom: 25px; }
        
        .grid-vagas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .vaga-item { border-bottom: 1px solid #333; padding: 6px; font-size: 12px; display: flex; justify-content: space-between; }
        .esgotado { color: var(--erro); font-weight: bold; text-transform: uppercase; }

        .aviso-tamborim { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--destaque); color: #fff; padding: 12px; border-radius: 8px; font-size: 11px; margin-bottom: 20px; text-align: center; line-height: 1.4; }

        .campo { margin-bottom: 18px; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; color: var(--cinza); margin-bottom: 6px; font-weight: 600; }
        input, select { padding: 14px; background: #000; border: 1px solid #444; color: #fff; border-radius: 10px; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: var(--destaque); outline: none; }
        
        .btn-acao { width: 100%; padding: 20px; background: var(--branco); color: #000; border: none; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; margin-top: 15px; font-size: 1.1rem; }
        .btn-acao:disabled { background: #555; cursor: not-allowed; }
        
        .secao-timer { background: #222; border: 2px solid var(--erro); border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .texto-timer { color: var(--erro); font-weight: bold; font-size: 1.2rem; text-transform: uppercase; margin: 0 0 5px 0; }
        #cronometro { color: #fff; font-size: 2.5rem; font-family: monospace; font-weight: bold; letter-spacing: 2px; }

        #qr-code { width: 100%; max-width: 550px; margin: 20px auto; border: 15px solid white; border-radius: 10px; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .chave-pix { background: #1a1a1a; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; color: var(--destaque); margin: 10px auto; border: 1px dashed #555; width: fit-content; max-width: 100%; word-wrap: break-word; }
    </style>
</head>
<body>

    <div id="tela-inicial" class="tela">
        <div style="text-align: center; padding-top: 20px;">
            <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Logo.jpg" class="logo-btn" onclick="abrirCadastro()">
            <h1 style="color:var(--destaque); margin-top:40px; letter-spacing: 2px; font-size: 2rem;">TOQUE NO LOGO PARA INICIAR</h1>
        </div>
    </div>

    <div id="tela-cadastro" class="tela">
        <div class="container">
            <h2 class="titulo-amarelo">Inscrições Abertas para Sócios</h2>
            <div id="vagas-container" class="grid-vagas"></div>
            <div class="aviso-tamborim"><strong>AVISO:</strong> PARA TAMBORIM, É OBRIGATÓRIO TRAZER SEU PRÓPRIO INSTRUMENTO.</div>

            <form id="formMatricula">
                <div class="campo"><label>Nome Completo *</label><input type="text" id="nome" required></div>
                <div class="campo"><label>CPF *</label><input type="text" id="cpf" class="mask-cpf" placeholder="000.000.000-00" required></div>
                <div class="campo"><label>Data de Nascimento *</label><input type="text" id="nasc" class="mask-data" placeholder="DD/MM/AAAA" onblur="validarIdade()" required></div>
                
                <div id="campos-responsavel" style="display:none; border-left: 4px solid var(--destaque); padding-left: 15px; background: #111; padding-top: 10px; border-radius: 0 10px 10px 0;">
                    <p style="font-size: 11px; color: var(--destaque); margin-top: 0;">DADOS DO RESPONSÁVEL</p>
                    <div class="campo"><label>Nome do Responsável *</label><input type="text" id="nomeResp"></div>
                    <div class="campo"><label>Telefone do Responsável *</label><input type="text" id="telResp" class="mask-tel"></div>
                </div>

                <div class="campo"><label>Sexo *</label>
                    <select id="sexo" onchange="atualizarInstrumentos()" required>
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>

                <div class="campo"><label>WhatsApp *</label><input type="text" id="tel" class="mask-tel" required></div>
                <div class="campo"><label>E-mail *</label><input type="email" id="email" placeholder="email@exemplo.com" required></div>
                <div class="campo"><label>Rede Social</label><input type="text" id="social"></div>
                
                <div class="campo"><label>Instrumento *</label><select id="instrumento" onchange="atualizarNiveis()" required></select></div>
                <div class="campo"><label>Nível de Conhecimento *</label><select id="nivel" required><option value="">Selecione o instrumento primeiro...</option></select></div>

                <div class="campo"><label>Tamanho da Camiseta *</label>
                    <select id="camiseta" required>
                        <option value="">Selecione...</option>
                        <option value="P">P</option><option value="M">M</option><option value="G">G</option><option value="GG">GG</option><option value="XG">XG</option>
                    </select>
                </div>

                <div class="campo"><label>Nº Sócio Gaviões *</label><input type="number" id="numSocio" required></div>
                <div class="campo"><label>Foto Carteirinha/Recibo *</label><input type="file" id="fotoSocio" accept="image/*" required></div>
                <div class="campo"><label>Foto de Perfil *</label><input type="file" id="fotoPerfil" accept="image/*" required></div>

                <button type="submit" class="btn-acao" id="btnReservar">Reservar Minha Vaga</button>
            </form>
        </div>
    </div>

    <div id="tela-pix" class="tela">
        <div class="container" style="text-align: center;">
            <h2 class="titulo-amarelo">Pagamento da Taxa</h2>
            <div class="secao-timer"><p class="texto-timer">Sua reserva expira em:</p><div id="cronometro">05:00</div></div>
            <p>Taxa de Matrícula + Camiseta: <br><strong style="font-size: 1.8rem; color: var(--sucesso);">R$ 50,00</strong></p>
            <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/QR_Cod.jpg" id="qr-code">
            <div class="chave-pix">Chave Pix: carnaval@gavioes.com.br</div>
            
            <div class="campo" style="text-align: left; margin-top: 20px;">
                <label>Anexar Comprovante do PIX *</label>
                <input type="file" id="fotoPix" accept="image/*">
            </div>
            
            <button class="btn-acao" onclick="enviarPix()" id="btnEnviarPix">Enviar Comprovante</button>
        </div>
    </div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbxtm0y_UXaIn8kua8IJJHPmopP8qqdUnw435jLp1HD0XPgcYNe8AIMIVA83tWOhgf5ngA/exec"; 
    let dadosCandidato = {};
    let intervaloCronometro;
    let idadeCalculada = null;

    function abrirCadastro() {
        $(".tela").hide();
        $("#tela-cadastro").css("display", "flex");
        window.scrollTo(0,0);
        carregarVagas();
    }

    async function carregarVagas() {
        try {
            const res = await fetch(URL_API);
            window.vagas = await res.json();
            let html = "";
            const listaFixa = ["Caixa", "Cuica", "Chocalho", "Repique", "Surdo 1", "Surdo 2", "Terceira", "Tamborim", "Timbal", "Xequere"];
            listaFixa.forEach(inst => {
                let qtd = window.vagas[inst] || 0;
                html += `<div class="vaga-item"><span>${inst}</span> <span>${qtd > 0 ? qtd : '<span class="esgotado">Esgotado</span>'}</span></div>`;
            });
            $("#vagas-container").html(html);
            atualizarInstrumentos();
        } catch (e) { console.error(e); }
    }

    function validarIdade() {
        const dataStr = $("#nasc").val();
        if(dataStr.length < 10) return;
        const partes = dataStr.split("/");
        const nasc = new Date(partes[2], partes[1] - 1, partes[0]);
        const hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        if (hoje < new Date(hoje.getFullYear(), nasc.getMonth(), nasc.getDate())) idade--;

        if (idade < 12) {
            alert("Apenas maiores de 12 anos.");
            $("#nasc").val("");
            $("#campos-responsavel").hide();
            idadeCalculada = null;
        } else {
            idadeCalculada = idade;
            if (idade < 18) {
                $("#campos-responsavel").show();
                $("#nomeResp, #telResp").prop("required", true);
            } else {
                $("#campos-responsavel").hide();
                $("#nomeResp, #telResp").prop("required", false);
            }
        }
    }

    function atualizarInstrumentos() {
        const sexo = $("#sexo").val();
        let html = '<option value="">Selecione...</option>';
        const listaInst = ["Caixa", "Cuica", "Chocalho", "Repique", "Surdo 1", "Surdo 2", "Terceira", "Tamborim", "Timbal", "Xequere"];
        listaInst.forEach(i => {
            if (sexo === "Masculino" && (i === "Xequere" || i === "Chocalho")) return;
            let vagas = window.vagas ? (window.vagas[i] || 0) : 0;
            html += `<option value="${i}" ${vagas <= 0 ? 'disabled' : ''}>${i} ${vagas <= 0 ? '(ESGOTADO)' : ''}</option>`;
        });
        $("#instrumento").html(html);
        $("#nivel").html('<option value="">Selecione o instrumento primeiro...</option>');
    }

    function atualizarNiveis() {
        const inst = $("#instrumento").val();
        const campo = $("#nivel");
        let html = '<option value="">Selecione...</option>';
        const basico = ["Iniciante", "Intermediário"];
        const aprimora = ["Curso de aprimoramento (para quem já toca)"];
        const completo = ["Iniciante", "Intermediário", "Curso de aprimoramento (para quem já toca)"];

        let lista = [];
        if (["Chocalho", "Xequere", "Repique", "Caixa", "Terceira"].includes(inst)) lista = basico;
        else if (["Tamborim", "Cuica", "Timbal"].includes(inst)) lista = completo;
        else if (["Surdo 1", "Surdo 2"].includes(inst)) lista = aprimora;

        lista.forEach(n => html += `<option value="${n}">${n}</option>`);
        campo.html(html);
    }

    $(document).ready(() => {
        $('.mask-cpf').mask('000.000.000-00');
        $('.mask-data').mask('00/00/0000');
        $('.mask-tel').mask('(00) 00000-0000');
    });

    $("#formMatricula").on("submit", async function(e) {
        e.preventDefault();
        $("#btnReservar").prop("disabled", true).text("Processando...");

        dadosCandidato = {
            acao: "RESERVAR",
            nome: $("#nome").val(),
            cpf: $("#cpf").val(),
            nasc: idadeCalculada,
            sexo: $("#sexo").val(),
            tel: $("#tel").val(),
            email: $("#email").val(),
            social: $("#social").val() || "N/A",
            instrumento: $("#instrumento").val(),
            nivel: $("#nivel").val(),
            camiseta: $("#camiseta").val(),
            numSocio: $("#numSocio").val(),
            nomeResp: $("#nomeResp").val() || "N/A",
            telResp: $("#telResp").val() || "N/A",
            fotoSocio: await toBase64(document.getElementById("fotoSocio").files[0]),
            fotoPerfil: await toBase64(document.getElementById("fotoPerfil").files[0])
        };

        try {
            const res = await fetch(URL_API, { method: "POST", body: JSON.stringify(dadosCandidato) });
            const final = await res.json();
            if (final.status === "sucesso") {
                $(".tela").hide();
                $("#tela-pix").css("display", "flex");
                iniciarCronometro();
                window.scrollTo(0,0);
            } else { alert(final.msg); window.location.reload(); }
        } catch (e) { alert("Erro na reserva."); }
        $("#btnReservar").prop("disabled", false).text("Reservar Minha Vaga");
    });

    function iniciarCronometro() {
        let tempo = 300;
        const display = document.getElementById('cronometro');
        intervaloCronometro = setInterval(() => {
            let min = String(Math.floor(tempo / 60)).padStart(2, '0');
            let sec = String(tempo % 60).padStart(2, '0');
            display.textContent = `${min}:${sec}`;
            if (tempo < 60) display.style.color = "var(--erro)";
            if (--tempo < 0) {
                clearInterval(intervaloCronometro);
                alert("Tempo esgotado!");
                window.location.reload();
            }
        }, 1000);
    }

    async function enviarPix() {
        const file = document.getElementById("fotoPix").files[0];
        
        // AJUSTE: Bloqueio caso não tenha arquivo
        if(!file) {
            alert("ATENÇÃO: Você precisa anexar a foto do comprovante para finalizar sua inscrição.");
            return;
        }

        $("#btnEnviarPix").prop("disabled", true).text("Enviando...");
        
        try {
            const payload = { 
                acao: "CONFIRMAR_PAGAMENTO", 
                cpf: dadosCandidato.cpf, 
                comprovante: await toBase64(file) 
            };

            const res = await fetch(URL_API, { method: "POST", body: JSON.stringify(payload) });
            const final = await res.json();

            if(final.status === "sucesso") {
                clearInterval(intervaloCronometro);
                // MENSAGEM FINAL SOLICITADA
                alert("COMPROVANTE ENVIADO!\n\nSua inscrição foi recebida com sucesso. A Diretoria da Ritimão irá validar seu comprovante e entrará em contato pelo Whatsapp e e-mail.");
                window.location.reload();
            } else {
                alert("Erro ao validar: " + final.msg);
                $("#btnEnviarPix").prop("disabled", false).text("Enviar Comprovante");
            }

        } catch (e) { 
            alert("Erro ao enviar PIX. Tente novamente."); 
            $("#btnEnviarPix").prop("disabled", false).text("Enviar Comprovante"); 
        }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = e => reject(e);
    });
</script>
</body>
</html>
