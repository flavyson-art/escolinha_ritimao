<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Ritimão 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #aaa; --destaque: #ffd700; --erro: #ff4444; }
        body, html { margin: 0; padding: 0; background-color: var(--preto); color: var(--branco); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        .tela { display: none; padding: 20px; min-height: 100vh; flex-direction: column; justify-content: center; align-items: center; width: 100%; box-sizing: border-box; }
        
        /* Corrigido: Removido 'Democratic' que quebrava o CSS */
        #tela-inicial { display: flex !important; } 

        .container { width: 100%; max-width: 400px; background: #111; padding: 25px; border-radius: 15px; border: 1px solid #333; box-sizing: border-box; position: relative; z-index: 2; }
        
        /* Garantindo que o botão esteja clicável e visível */
        .logo-btn { width: 220px; height: 220px; border-radius: 50%; border: 4px solid var(--branco); cursor: pointer; transition: 0.3s; z-index: 999; position: relative; display: block; }
        .logo-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--destaque); }

        .campo { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { font-size: 0.75rem; color: var(--cinza); margin-bottom: 4px; font-weight: bold; }
        input, select { padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 1rem; }
        
        button { width: 100%; padding: 16px; background: var(--branco); color: #000; border: none; font-weight: 900; border-radius: 8px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .vaga-aviso { font-size: 11px; text-align: center; margin-bottom: 15px; padding: 5px; border-radius: 5px; background: #222; }
    </style>
</head>
<body>

    <div id="tela-inicial" class="tela">
        <img src="https://raw.githubusercontent.com/flavyson-art/escolinha_ritimao/main/Logo.jpg" 
             class="logo-btn" 
             id="btn-iniciar"
             onclick="abrirCadastro()"
             onerror="this.src='https://via.placeholder.com/200?text=CLIQUE+PARA+INICIAR'">
        <h2 style="text-align:center; margin-top:25px; letter-spacing: 1px;">TOQUE NO LOGO PARA INICIAR</h2>
    </div>

    <div id="tela-cadastro" class="tela" style="display:none !important;">
        <div class="container">
            <h3 style="color:var(--destaque); text-align:center; margin-top:0;">CADASTRO DE ALUNO</h3>
            <div id="status-vagas" class="vaga-aviso">Carregando vagas...</div>
            
            <form id="formMatricula">
                <div class="campo"><label>Nome Completo</label><input type="text" id="nome" required></div>
                <div class="campo"><label>CPF</label><input type="text" id="cpf" class="mask-cpf" required></div>
                <div class="campo"><label>Sexo</label>
                    <select id="sexo" required onchange="atualizarInstrumentos()">
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>
                <div class="campo"><label>Instrumento</label>
                    <select id="instrumento" required>
                        <option value="">Selecione o sexo primeiro</option>
                    </select>
                </div>
                <button type="submit" id="btnEnviar">AVANÇAR PARA PAGAMENTO</button>
            </form>
        </div>
    </div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbxtm0y_UXaIn8kua8IJJHPmopP8qqdUnw435jLp1HD0XPgcYNe8AIMIVA83tWOhgf5ngA/exec";
    window.vagas = {};

    function abrirCadastro() {
        console.log("Comando abrirCadastro executado");
        
        // TROCA DE TELA IMEDIATA (Não espera a API)
        const t1 = document.getElementById('tela-inicial');
        const t2 = document.getElementById('tela-cadastro');
        
        if(t1 && t2) {
            t1.style.setProperty('display', 'none', 'important');
            t2.style.setProperty('display', 'flex', 'important');
            carregarVagas();
        } else {
            alert("Erro crítico: Telas não encontradas no HTML.");
        }
    }

    async function carregarVagas() {
        const status = document.getElementById('status-vagas');
        try {
            const response = await fetch(URL_API);
            if (!response.ok) throw new Error();
            window.vagas = await response.json();
            status.innerHTML = "✅ Vagas sincronizadas em tempo real";
            status.style.color = "#00ff00";
            atualizarInstrumentos();
        } catch (e) {
            console.error("Erro API:", e);
            status.innerHTML = "⚠️ Sistema Offline (Vagas padrão ativadas)";
            status.style.color = "orange";
            // Backup para o site não travar
            window.vagas = {"Caixa":2, "Cuica":2, "Chocalho":2, "Repique":2, "Surdo 1":2, "Surdo 2":2, "Tamborim":2};
            atualizarInstrumentos();
        }
    }

    function atualizarInstrumentos() {
        const sexo = document.getElementById('sexo').value;
        const select = document.getElementById('instrumento');
        let opcoes = '<option value="">Selecione...</option>';
        
        for (let inst in window.vagas) {
            if (sexo === "Masculino" && (inst === "Chocalho" || inst === "Xequere")) continue;
            let qtd = window.vagas[inst];
            opcoes += `<option value="${inst}" ${qtd <= 0 ? 'disabled' : ''}>${inst} (${qtd} vagas)</option>`;
        }
        select.innerHTML = opcoes;
    }

    $(document).ready(function(){
        $('.mask-cpf').mask('000.000.000-00');
    });
</script>
</body>
</html>
